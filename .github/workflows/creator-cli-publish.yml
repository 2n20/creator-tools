name: Publish creator tools

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-tools-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '2n20/creator-tools' && startsWith(github.ref, 'refs/tags/creator-cli-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies
        run: |
          python -m pip --isolated install --require-hashes --only-binary=:all: -r requirements-release.txt
          python -m pip --isolated install --require-hashes --only-binary=:all: -r src/twon20/templates/hyperliquid-python/requirements-runner.txt
      - name: Verify tag and behavior
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "creator-cli-v" + v'
          PYTHONPATH=src python -m unittest discover -s tests -v
          cd src/twon20/templates/hyperliquid-python
          PYTHONPATH=../../.. python -m unittest discover -s tests -v
      - name: Build and verify installed artifacts
        env:
          SOURCE_DATE_EPOCH: '1790985600'
        run: |
          python scripts/build_release.py
          python -m pip --isolated install --no-deps dist/*.whl
          python scripts/check_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: creator-tools-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: creator-cli-pypi
      url: https://pypi.org/project/2n20/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: creator-tools-distributions
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          attestations: true
