name: Creator tools checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed dependencies
        run: |
          python -m pip --isolated install --require-hashes --only-binary=:all: -r requirements-release.txt
          python -m pip --isolated install --require-hashes --only-binary=:all: -r src/twon20/templates/hyperliquid-python/requirements-runner.txt
      - name: Test CLI and starter behavior
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          cd src/twon20/templates/hyperliquid-python
          python -m unittest discover -s tests -v
      - name: Build and verify installed artifacts
        env:
          SOURCE_DATE_EPOCH: '1790985600'
        run: |
          python scripts/build_release.py
          python -m pip --isolated install --no-deps dist/*.whl
          python scripts/check_release.py
